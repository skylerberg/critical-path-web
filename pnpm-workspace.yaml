# pnpm 11 reads settings from nowhere else: .npmrc carries auth and registry only, and
# the package.json "pnpm" field is no longer read at all — neither is npm's top-level
# `overrides`, which is why the block below moved here rather than staying put. Keys are
# camelCase; a kebab-case key is ignored silently, with no warning and exit 0.
#
# No `packages:` key, so the root is the only member. This repo has no nested packages.

# strictDepBuilds fails the install on any dependency whose install scripts have not
# been ruled on, so a denial has to be written down rather than left out. Exact names
# and name@range only; a glob is an error.
allowBuilds:
  unrs-resolver: true # eslint-plugin-import-x's resolver; prebuilt binary

# One version of TypeScript, named once. openapi-typescript declares a `^5.x` peer and
# this repo is on 6, so without the override pnpm reports an unmet peer on every
# install. npm expressed the same thing as `"typescript": "$typescript"`; pnpm 11 still
# accepts `$name` but deprecates it, and a catalog is the replacement.
catalog:
  typescript: 6.0.3

overrides:
  openapi-typescript>typescript: 'catalog:'

# Default is `install`, which silently installs on any `pnpm run`/`pnpm exec` when
# node_modules looks stale — a rebase that moved package.json, most often. Fail loudly
# instead. The api repo has to leave this off; its own file says why.
verifyDepsBeforeRun: error
